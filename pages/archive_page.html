<title>onul_ns 카드뉴스 보관함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* 레이아웃: 위쪽 날짜 띠 → 그날의 카드 7장 가로 넘기기 → 캡션 · 고른 이유 · 사실 확인 */
:root {
  --paper: #f8f6f1; --sheet: #ffffff; --ink: #121a2e; --sub: #4a5468; --line: #d6d2c8;
  --navy: #1e408c; --gold: #b08a3c; --soft: #eceff7; --bad: #b3362f; --bad-soft: #f8e7e5;
  --ok-soft: #e7eefb;
  --serif: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151d; --sheet: #1b1f2a; --ink: #e9ecf3; --sub: #aab2c3; --line: #2f3545;
  --navy: #8fb0f0; --gold: #d6b26a; --soft: #222a3b; --bad: #f08a82; --bad-soft: #3a2224;
  --ok-soft: #1f2a40; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151d; --sheet: #1b1f2a; --ink: #e9ecf3; --sub: #aab2c3; --line: #2f3545;
  --navy: #8fb0f0; --gold: #d6b26a; --soft: #222a3b; --bad: #f08a82; --bad-soft: #3a2224;
  --ok-soft: #1f2a40; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { border-top: 4px solid var(--ink); border-bottom: 1px solid var(--line); padding-block: 12px;
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--serif); font-size: 1.55rem; margin: 0; text-wrap: balance; }
.handle { color: var(--sub); font-size: .9rem; }
.dates { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px; scrollbar-width: thin; }
.date { flex: none; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 999px;
  padding: 6px 14px; font: 500 .9rem var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  font-variant-numeric: tabular-nums; }
.date:hover { border-color: var(--navy); }
.date[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
.date .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy); }
.date[aria-pressed="true"] .dot { background: var(--paper); }
.date.failed .dot { background: var(--bad); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.day-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-block: 6px 14px; }
.day-head h2 { font-family: var(--serif); font-size: 1.3rem; margin: 0; }
.pill { font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--navy); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.meta { color: var(--sub); font-size: .85rem; }

.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 210px); gap: 12px;
  overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
.card { scroll-snap-align: start; border: 1px solid var(--line); background: var(--sheet); padding: 0; cursor: zoom-in;
  aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; position: relative; border-radius: 2px; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .no { position: absolute; left: 6px; top: 6px; background: var(--ink); color: var(--paper); font-size: .72rem;
  font-weight: 700; padding: 1px 7px; border-radius: 2px; font-variant-numeric: tabular-nums; }
.fail-box { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); padding: 12px 16px;
  white-space: pre-wrap; word-break: break-word; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 22px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
section.box { background: var(--sheet); border: 1px solid var(--line); padding: 16px 18px; min-width: 0; }
section.box.wide { grid-column: 1 / -1; }
.box h3 { margin: 0 0 10px; font-size: .82rem; letter-spacing: .04em; color: var(--gold); display: flex;
  justify-content: space-between; align-items: center; gap: 10px; }
.box h3 .note { color: var(--sub); font-weight: 500; letter-spacing: 0; }
.caption, .facts { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: var(--sans); }
.facts { font-size: .9rem; }
.facts a, .why a { color: var(--navy); }
.copy { border: 1px solid var(--navy); background: transparent; color: var(--navy); font: 700 .8rem var(--sans);
  padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.copy:hover { background: var(--navy); color: var(--paper); }
.why { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.why li { display: grid; grid-template-columns: 2.2em auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
.why .n { font-family: var(--serif); color: var(--gold); font-variant-numeric: tabular-nums; }
.tag { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 2px; background: var(--soft); color: var(--navy); }
.tag.fun { background: var(--gold); color: var(--sheet); }
.why .t { font-weight: 700; }
.why .r { grid-column: 3; color: var(--sub); font-size: .9rem; }

.empty { border: 1px dashed var(--line); padding: 28px 20px; text-align: center; color: var(--sub); margin-top: 18px; }
.empty strong { display: block; color: var(--ink); font-family: var(--serif); font-size: 1.1rem; margin-bottom: 6px; }
.notice { color: var(--sub); font-size: .85rem; margin-top: 6px; }

.lightbox { position: fixed; inset: 0; background: rgba(10, 12, 18, .88); display: flex; align-items: center;
  justify-content: center; z-index: 20; padding: 16px; }
.lightbox img { max-height: calc(100% - 70px); max-width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: #fff; }
.lb-bar { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex;
  justify-content: center; gap: 10px; }
.lb-bar button { border: 1px solid #fff; background: transparent; color: #fff; font: 700 .9rem var(--sans);
  padding: 6px 16px; border-radius: 999px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <header>
    <h1>오늘의 핵심 뉴스 보관함</h1>
    <span class="handle">@onul_ns · 매일 아침 7시 13분 예약 작업 결과</span>
  </header>
  <nav class="dates" id="dates" aria-label="날짜 고르기"></nav>
  <p class="notice" id="notice" hidden></p>
  <main id="day"></main>
</div>
<div class="lightbox" id="lb" hidden>
  <img id="lb-img" alt="">
  <div class="lb-bar">
    <button id="lb-prev" type="button">이전</button>
    <button id="lb-close" type="button">닫기</button>
    <button id="lb-next" type="button">다음</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let days = [], current = null, lbList = [], lbIdx = 0;

function cardSrc(c) {
  if (c && typeof c.url === "string" && (c.url.startsWith("/_blob/") || c.url.startsWith("https://"))) return c.url;
  if (c && typeof c.id === "string" && /^[0-9a-f]{32}$/.test(c.id)) return "/_blob/" + c.id;
  return "";
}

/* 글 속의 https 주소만 링크로, 나머지는 그대로 글자로 */
function linkify(parent, text) {
  const re = /https:\/\/[^\s)\]>"']+/g; let last = 0, m;
  while ((m = re.exec(text))) {
    parent.append(text.slice(last, m.index));
    const a = el("a", null, m[0]); a.href = m[0]; a.target = "_blank"; a.rel = "noopener"; parent.append(a);
    last = m.index + m[0].length;
  }
  parent.append(text.slice(last));
}

function dateLabel(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d.id || ""); if (!m) return d.id || "";
  const w = typeof d.weekday === "string" ? " (" + d.weekday + ")" : "";
  return Number(m[2]) + "월 " + Number(m[3]) + "일" + w;
}

function renderDates() {
  const nav = $("dates"); nav.replaceChildren();
  for (const d of days) {
    const b = el("button", "date" + (d.status === "failed" ? " failed" : ""));
    b.type = "button"; b.setAttribute("aria-pressed", String(d.id === current));
    b.append(el("span", "dot"), dateLabel(d));
    b.addEventListener("click", () => { current = d.id; try { localStorage.setItem("day", d.id); } catch (e) {} render(); });
    nav.append(b);
  }
}

function renderEmpty(main) {
  const e = el("div", "empty");
  e.append(el("strong", null, "아직 쌓인 카드뉴스가 없어요"));
  e.append(el("span", null, "매일 아침 7시 13분 예약 작업이 끝나면 그날의 카드 7장, 캡션, 사실 확인 결과가 여기에 날짜별로 올라와요."));
  main.append(e);
}

function render() {
  renderDates();
  const main = $("day"); main.replaceChildren();
  const d = days.find((x) => x.id === current);
  if (!d) { renderEmpty(main); return; }

  const head = el("div", "day-head");
  head.append(el("h2", null, dateLabel(d)));
  head.append(el("span", "pill" + (d.status === "failed" ? " bad" : ""), d.status === "failed" ? "실패" : "전달됨"));
  if (typeof d.checker === "string" && d.checker) head.append(el("span", "meta", "검사기: " + d.checker));
  if (typeof d.made_at === "string") {
    const t = new Date(d.made_at);
    if (!isNaN(t)) head.append(el("span", "meta", t.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit" }) + " 완료"));
  }
  main.append(head);

  if (d.status === "failed") {
    main.append(el("div", "fail-box", typeof d.error === "string" && d.error ? d.error : "예약 작업이 카드를 만들지 못했어요."));
  }

  const cards = Array.isArray(d.cards) ? d.cards : [];
  if (cards.length) {
    const row = el("div", "cards");
    lbList = cards.map(cardSrc);
    cards.forEach((c, i) => {
      const src = lbList[i]; if (!src) return;
      const b = el("button", "card"); b.type = "button";
      b.setAttribute("aria-label", (i + 1) + "번 카드 크게 보기");
      const img = el("img"); img.src = src; img.alt = (i + 1) + "번 카드"; img.loading = "lazy";
      b.append(img, el("span", "no", String(i + 1).padStart(2, "0")));
      b.addEventListener("click", () => openLb(i));
      row.append(b);
    });
    main.append(row);
  }

  const cols = el("div", "cols");
  if (typeof d.caption === "string" && d.caption) {
    const s = el("section", "box");
    const h = el("h3", null, "캡션");
    const btn = el("button", "copy", "복사"); btn.type = "button";
    btn.addEventListener("click", () => copyText(d.caption, btn, s.querySelector(".caption")));
    h.append(btn); s.append(h, el("p", "caption", d.caption)); cols.append(s);
  }
  if (Array.isArray(d.why) && d.why.length) {
    const s = el("section", "box"); const h = el("h3", null, "왜 이 5개인가");
    h.append(el("span", "note", "게시용 아님")); s.append(h);
    const ul = el("ul", "why");
    d.why.forEach((w, i) => {
      if (!w || typeof w !== "object") return;
      const li = el("li");
      const kind = w.kind === "흥미" ? "흥미" : "중요";
      li.append(el("span", "n", String(w.n || i + 1).padStart(2, "0")), el("span", "tag" + (kind === "흥미" ? " fun" : ""), kind),
        el("span", "t", typeof w.title === "string" ? w.title : ""));
      if (typeof w.reason === "string" && w.reason) li.append(el("span", "r", w.reason));
      ul.append(li);
    });
    s.append(ul); cols.append(s);
  }
  if (typeof d.factcheck === "string" && d.factcheck) {
    const s = el("section", "box wide"); const h = el("h3", null, "사실 확인 결과");
    h.append(el("span", "note", "게시용 아님")); s.append(h);
    const p = el("p", "facts"); linkify(p, d.factcheck); s.append(p); cols.append(s);
  }
  if (cols.childElementCount) main.append(cols);
}

async function copyText(text, btn, node) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사됨"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(node);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "선택됨, Ctrl+C";
  }
  setTimeout(() => { btn.textContent = "복사"; }, 2000);
}

function openLb(i) { lbIdx = i; showLb(); $("lb").hidden = false; $("lb-close").focus(); }
function showLb() { $("lb-img").src = lbList[lbIdx] || ""; $("lb-img").alt = (lbIdx + 1) + "번 카드"; }
function stepLb(k) { const n = lbList.length; if (!n) return; lbIdx = (lbIdx + k + n) % n; showLb(); }
$("lb-prev").addEventListener("click", () => stepLb(-1));
$("lb-next").addEventListener("click", () => stepLb(1));
$("lb-close").addEventListener("click", () => { $("lb").hidden = true; });
$("lb").addEventListener("click", (e) => { if (e.target === $("lb")) $("lb").hidden = true; });
document.addEventListener("keydown", (e) => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") $("lb").hidden = true;
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});

function setNotice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

render();
setNotice("불러오는 중이에요…");
(async () => {
  const db = await claude.use("db");
  if (!db) { setNotice("보관함을 불러올 수 없어요. claude.ai에 로그인한 상태에서 열어 주세요."); return; }
  let timer = setTimeout(() => setNotice("보관함에 아직 연결되지 않았어요. 잠시 뒤 다시 열어 주세요."), 10000);
  db.collection("days").onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setNotice(""); }
    days = snap.docs.filter((x) => x.exists).map((x) => Object.assign({ id: x.id }, x.data()))
      .sort((a, b) => (a.id < b.id ? 1 : -1));
    let saved = null; try { saved = localStorage.getItem("day"); } catch (e) {}
    if (!days.some((x) => x.id === current)) current = days.some((x) => x.id === saved) ? saved : (days[0] && days[0].id) || null;
    render();
  }, (err) => { clearTimeout(timer); setNotice("보관함을 읽지 못했어요 (" + (err && err.code ? err.code : "오류") + ")."); });
})();
</script>
